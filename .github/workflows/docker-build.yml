name: Build OpenWrt Docker Image

on:
workflow_dispatch:

env:
REPO_URL: https://github.com/immortalwrt/immortalwrt
REPO_BRANCH: v24.10
IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/openwrt

jobs:
build:
runs-on: ubuntu-22.04

```
strategy:
  matrix:
    arch: [x86_64, arm64]

steps:
- uses: actions/checkout@v4

- name: Install deps
  run: |
    sudo apt update
    sudo apt install -y build-essential clang flex bison g++ gawk \
    gcc-multilib g++-multilib gettext git libncurses-dev \
    libssl-dev python3-distutils rsync unzip zlib1g-dev file wget \
    qemu-user-static

- name: Clone source
  run: |
    git clone $REPO_URL -b $REPO_BRANCH openwrt

- name: Load config
  run: |
    if [ "${{ matrix.arch }}" = "x86_64" ]; then
      cp configs/x86.config openwrt/.config
    else
      cp configs/arm64.config openwrt/.config
    fi

- name: Custom
  run: |
    chmod +x diy.sh
    cd openwrt
    ../diy.sh

- name: Feeds
  run: |
    cd openwrt
    ./scripts/feeds update -a
    ./scripts/feeds install -a

- name: Build rootfs
  run: |
    cd openwrt
    make defconfig
    make -j$(nproc)

- name: Prepare rootfs
  run: |
    mkdir rootfs
    tar -xf openwrt/bin/targets/*/*/*rootfs.tar.gz -C rootfs

- name: Build Docker image
  run: |
    docker build -t $IMAGE_NAME:${{ matrix.arch }} .

- name: Login GHCR
  run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

- name: Push
  run: |
    docker push $IMAGE_NAME:${{ matrix.arch }}
```
