name: Build ImmortalWrt Docker Image

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/openwrt

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # Build environment
      # =========================
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3-distutils rsync unzip zlib1g-dev file wget \
            ccache swig libpython3-dev python3-setuptools python3-yaml libelf-dev

      # =========================
      # Clone OpenWrt source
      # =========================
      - name: Clone source
        run: |
          git clone $REPO_URL -b $REPO_BRANCH openwrt

      # =========================
      # Cache ccache (FIXED)
      # =========================
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: ${{ matrix.arch }}-ccache-${{ github.ref }}
          restore-keys: |
            ${{ matrix.arch }}-ccache-

      # =========================
      # DIY script
      # =========================
      - name: DIY script
        run: |
          chmod +x diy.sh
          cd openwrt
          ../diy.sh

      # =========================
      # Load config
      # =========================
      - name: Load custom config
        run: |
          ARCH_CFG=${{ matrix.arch }}
          if [ "$ARCH_CFG" = "x86_64" ]; then
            CFG="x86"
          else
            CFG="arm64"
          fi

          if [ -f "config/${CFG}.config" ]; then
            cp config/${CFG}.config openwrt/.config
          fi

          mkdir -p openwrt/files
          [ -d files ] && cp -r files/* openwrt/files/ || true

      # =========================
      # Build OpenWrt
      # =========================
      - name: Build OpenWrt
        run: |
          cd openwrt
          make defconfig
          make -j$(nproc) || make -j1 V=s

      # =========================
      # Extract rootfs safely
      # =========================
      - name: Prepare rootfs
        run: |
          ROOTFS=$(find openwrt/bin/targets -name "*rootfs.tar.gz" | head -n 1)

          echo "Found rootfs: $ROOTFS"

          mkdir -p rootfs
          tar -xzf "$ROOTFS" -C rootfs

          # optional cleanup
          rm -rf rootfs/lib/modules || true
          rm -rf rootfs/usr/lib/modules || true

          tar -czf openwrt-rootfs.tar.gz -C rootfs .

      # =========================
      # Docker buildx setup (IMPORTANT)
      # =========================
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =========================
      # Login Docker Hub
      # =========================
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # =========================
      # Build & Push Docker image
      # =========================
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ matrix.arch == 'x86_64' && 'linux/amd64' || 'linux/arm64' }}
          tags: ${{ env.IMAGE_NAME }}:${{ matrix.arch }}
